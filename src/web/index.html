<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Reasoner - 語意搜尋與解釋系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-brain"></i> Hybrid Reasoner</h1>
            <p class="subtitle">結合 LLM 推理、向量檢索與規則評分的混合推薦引擎</p>
        </header>

        <div class="search-box">
            <input type="text" id="query-input" placeholder="試試看：找一本字數超過20萬字，關於魔法與冒險的完結小說...">
            
            <select id="model-select" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-left: 10px; cursor: pointer; background: white;">
                <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash (快速)</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (精確)</option>
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (平衡)</option>
            </select>

            <button id="search-btn" onclick="performSearch()">
                <i class="fa-solid fa-magnifying-glass"></i> 搜尋
            </button>
        </div>

        <div id="loading" class="hidden">
            <i class="fa-solid fa-circle-notch fa-spin"></i> AI 正在分析語意與檢索資料庫...
        </div>

        <div id="results-container">
            </div>
    </div>

    <script src="script.js?v=1.1.3"></script>
</body>
</html>
